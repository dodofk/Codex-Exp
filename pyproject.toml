[project]
name = "auto-paper-phase3"
version = "0.1.0"
description = "Phase 3 ingestion and preprocessing tooling for Auto-Paper experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19.0",
    "numpy>=2.0.0",
    "pytest>=8.4.0",
    "prefect>=2.16.0",
    "redis>=5.0.0",
    "sacrebleu>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "audioread",
]
model-cpu = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers>=4.44",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
    "peft>=0.11",
    "sacrebleu>=2.4.0",
]
