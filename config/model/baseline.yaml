text_tower:
  name: qwen3
  checkpoint: Qwen/Qwen3-0.6B
  enable_lora: false
  max_length: 256
  trust_remote_code: true
audio_tower:
  name: distil_whisper
  checkpoint: openai/whisper-tiny
projection_head:
  dim: 768
  temperature_init: 0.07
optimizer:
  name: adamw
  lr: 5.0e-5
training:
  epochs: 3
  batch_size: 16
  max_tokens_per_batch: 4096
  gradient_checkpointing: true
  loss:
    temperature: 0.07
    spreadout_weight: 0.0
    spreadout_margin: 0.0
dataset:
  root: data/processed/fleurs/smoke
  manifest_glob: "manifest/train*.jsonl"
  batch_size: 16
  shuffle: true
  seed: 13
  max_batches: 1
evaluation:
  metrics: ["recall_at_1", "mrr", "bleu"]
