text_tower:
  name: identity
  embedding_dim: 768
audio_tower:
  name: mean_pooling
  embedding_dim: 768
projection_head:
  dim: 768
  temperature_init: 0.07
optimizer:
  name: adamw
  lr: 5.0e-5
training:
  epochs: 3
  batch_size: 16
  max_tokens_per_batch: 4096
  gradient_checkpointing: true
evaluation:
  metrics: ["recall_at_1", "mrr", "bleu"]
