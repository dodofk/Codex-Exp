name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ingestion plan smoke test
        run: uv run --frozen make data-plan DATASET=fleurs

      - name: Preprocess plan smoke test
        run: uv run --frozen make preprocess-plan DATASET=fleurs

      - name: Run pytest
        run: uv run --frozen pytest
